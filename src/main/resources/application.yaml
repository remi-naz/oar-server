spring:
  application:
    name: oar-server
    version: 0.1.0
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    root: INFO
    dev.ridill.oar_server: INFO
  structured:
    format:
      console: ecs

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 30d
  google:
    client-id: ${GOOGLE_CLIENT_ID}
