spring:
  application:
    name: oar-server
    version: 0.1.0
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1740000
      keepalive-time: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    dev.ridill.oar_server: INFO
  structured:
    format:
      console: ecs

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 30d
  google:
    client-id: ${GOOGLE_CLIENT_ID}
