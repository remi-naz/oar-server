spring:
  config:
    activate:
      on-profile: dev

  application:
    name: oar-server
    version: 0.1.0

logging:
  level:
    dev.ridill.oar_server: DEBUG
  structured:
    format:
      console: ""
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 30d
  google:
    client-id: ${GOOGLE_CLIENT_ID}